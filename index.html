<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаблоны ПС</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><rect x='7' y='9' width='18' height='2.5' rx='1.25' fill='white'/><rect x='7' y='14.75' width='18' height='2.5' rx='1.25' fill='white'/><rect x='7' y='20.5' width='11' height='2.5' rx='1.25' fill='white'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-page:    #eef0f4;
  --bg-card:    #ffffff;
  --bg-subtle:  #f7f8fa;
  --bg-input:   #f2f4f7;
  --border:     #e3e6ec;
  --border-md:  #d1d5db;
  --text-1:     #111827;
  --text-2:     #4b5563;
  --text-3:     #9ca3af;
  --accent:     #2563eb;
  --accent-dk:  #1d4ed8;
  --accent-lt:  #eff6ff;
  --green:      #16a34a;
  --green-lt:   #f0fdf4;
  --red:        #dc2626;
  --red-lt:     #fef2f2;
  --amber-lt:   #fffbeb;
  --amber-bdr:  #fde68a;
  --amber-text: #92400e;
  --radius-sm:  6px;
  --radius:     10px;
  --radius-lg:  14px;
  --shadow-card: 0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
  --shadow-input: inset 0 1px 2px rgba(0,0,0,.04);
}

html { min-height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-page);
  color: var(--text-1);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  padding: 48px 20px 80px;
}

/* ── Page shell ──────────────────────────────────────────────────────────── */
.shell {
  max-width: 720px;
  margin: 0 auto;
}

.page-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 28px;
  gap: 12px;
}
.page-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.4px;
}
.page-sub {
  font-size: 13px;
  color: var(--text-3);
  margin-top: 3px;
}

/* ── Input card ─────────────────────────────────────────────────────────── */
.input-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  margin-bottom: 20px;
}

.input-card-inner {
  padding: 20px 20px 0;
}

.field-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: .05em;
}
.field-label-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

/* Paste area */
.paste-wrap {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1.5px solid var(--border);
  background: var(--bg-input);
  box-shadow: var(--shadow-input);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.paste-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,.12), var(--shadow-input);
  background: #fff;
}
.paste-icon {
  position: absolute;
  top: 11px; right: 12px;
  color: var(--text-3);
  pointer-events: none;
  transition: color 0.15s;
}
.paste-wrap:focus-within .paste-icon { color: var(--accent); }

textarea.paste-area {
  display: block;
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  color: var(--text-1);
  padding: 11px 40px 11px 13px;
  resize: vertical;
  min-height: 88px;
  max-height: 220px;
  line-height: 1.6;
}
textarea.paste-area::placeholder { color: var(--text-3); }

.paste-hint {
  padding: 6px 13px 12px;
  font-size: 11px;
  color: var(--text-3);
}

/* Single-line text field (ticket id) */
.field-group { margin-top: 16px; }
input.text-input {
  display: block;
  width: 100%;
  border-radius: var(--radius);
  border: 1.5px solid var(--border);
  background: var(--bg-input);
  box-shadow: var(--shadow-input);
  outline: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  color: var(--text-1);
  padding: 10px 13px;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
input.text-input::placeholder { color: var(--text-3); }
input.text-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,.12), var(--shadow-input);
  background: #fff;
}
.field-hint {
  padding: 6px 2px 0;
  font-size: 11px;
  color: var(--text-3);
}

/* Actions bar */
.actions-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 20px;
  margin-top: 20px;
  border-top: 1px solid var(--border);
  background: var(--bg-subtle);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: none;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.13s;
  line-height: 1;
}
.btn svg { flex-shrink: 0; }
.btn-primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 1px 3px rgba(37,99,235,.4);
}
.btn-primary:hover { background: var(--accent-dk); box-shadow: 0 2px 6px rgba(37,99,235,.4); }
.btn-primary:active { transform: scale(.98); }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border-md);
  color: var(--text-2);
}
.btn-ghost:hover { border-color: var(--text-3); color: var(--text-1); background: var(--bg-subtle); }

/* ── Notice ─────────────────────────────────────────────────────────────── */
.notice {
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  margin-bottom: 16px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.notice svg { flex-shrink: 0; margin-top: 1px; }
.notice-err  { background: var(--red-lt);   border: 1px solid #fecaca; color: var(--red); }
.notice-warn { background: var(--amber-lt); border: 1px solid var(--amber-bdr); color: var(--amber-text); }

/* ── Result block ───────────────────────────────────────────────────────── */
.result-block {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  margin-bottom: 16px;
}
.result-header {
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-subtle);
  gap: 10px;
}
.result-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  display: flex;
  align-items: center;
  gap: 7px;
}
.result-title-pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  background: var(--accent-lt);
  color: var(--accent);
  border: 1px solid rgba(37,99,235,.15);
}

.copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 13px;
  background: var(--bg-card);
  border: 1px solid var(--border-md);
  border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.13s;
  white-space: nowrap;
}
.copy-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-lt); }
.copy-btn.ok { border-color: var(--green) !important; color: var(--green) !important; background: var(--green-lt) !important; }

/* Generated message line */
.result-line {
  padding: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-1);
  word-break: break-all;
  background: #fff;
}

/* Breakdown (display only — not copied) */
.result-rows { display: flex; flex-direction: column; border-top: 1px solid var(--border); }
.result-row {
  display: grid;
  grid-template-columns: 196px 1fr;
  min-height: 32px;
  align-items: center;
}
.result-row + .result-row { border-top: 1px solid #f3f4f6; }
.result-row:nth-child(odd)  { background: #fafbfc; }
.result-row:nth-child(even) { background: #fff; }

.rk {
  padding: 7px 13px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-3);
  border-right: 1px solid #f0f1f4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  align-self: center;
}
.rv {
  padding: 7px 13px;
  font-size: 12px;
  color: var(--text-1);
  font-family: 'JetBrains Mono', monospace;
  word-break: break-all;
  line-height: 1.55;
}
.rv.is-missing { color: #f87171; font-style: italic; font-family: 'Inter', sans-serif; font-size: 12px; }

/* ── Misc ───────────────────────────────────────────────────────────────── */
.hidden { display: none !important; }

/* footer */
.page-footer {
  margin-top: 40px;
  text-align: center;
  font-size: 12px;
  color: var(--text-3);
}
</style>
</head>
<body>
<div class="shell">

  <div class="page-header">
    <div>
      <div class="page-title">Шаблоны ПС</div>
      <div class="page-sub">Генератор текста для чата по данным из таблицы</div>
    </div>
  </div>

  <div class="input-card">
    <div class="input-card-inner">
      <div class="field-label">
        <span class="field-label-dot"></span>
        Данные из таблицы пополнений
      </div>
      <div class="paste-wrap">
        <svg class="paste-icon" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="4" y="2" width="8" height="3" rx="1"/><rect x="2" y="3.5" width="12" height="10" rx="1.5"/>
          <path d="M5 8h6M5 11h4"/>
        </svg>
        <textarea class="paste-area" id="paste"
          placeholder="Вставь строки из таблицы (Ctrl+V)&#10;Первая строка — заголовки, вторая — данные"></textarea>
        <div class="paste-hint">Tab-разделитель · заголовки ищутся по названию, порядок не важен</div>
      </div>

      <div class="field-group">
        <div class="field-label">
          <span class="field-label-dot"></span>
          Ticket id
        </div>
        <input class="text-input" id="ticket" type="text" placeholder="Например: 20003544" autocomplete="off">
        <div class="field-hint">Вводится вручную — в таблице этого поля нет</div>
      </div>
    </div>
    <div class="actions-bar">
      <button class="btn btn-primary" onclick="generate()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
        Сгенерировать
      </button>
      <button class="btn btn-ghost" onclick="clearAll()">Очистить</button>
    </div>
  </div>

  <div id="notice" class="hidden"></div>
  <div id="results"></div>

  <div class="page-footer">Формат: transaction id // PS id // user id // ticket id</div>
</div>

<script>
const DASH = '—';

function parseTSV(raw) {
  const lines = raw.split('\n').map(l => l.trimEnd()).filter(l => l !== '');
  if (lines.length < 2) return null;
  const hCells = lines[0].split('\t');
  const vCells = lines[1].split('\t');
  let offset = 0;
  while (offset < hCells.length && hCells[offset].trim() === '') offset++;
  const row = {};
  for (let i = offset; i < hCells.length; i++) {
    const h = hCells[i].trim();
    if (!h) continue;
    row[h] = (vCells[i] || '').replace(/ /g,'').trim();
  }
  return Object.keys(row).length ? row : null;
}

function g(row, key) {
  for (const k of Object.keys(row))
    if (k.trim().toLowerCase() === key.trim().toLowerCase()) return row[k];
  return null;
}

// Значение ext_refid из колонки «Доп. параметры»:
// {... "ext_refid": "a4565868-f313-4c81-9d0c-997383157823", ...} → a4565868-f313-4c81-9d0c-997383157823
function extractExtRefid(extra) {
  if (!extra) return '';
  const m = extra.match(/"?ext_refid"?\s*[:=]\s*"([^"]*)"/)
         || extra.match(/"?ext_refid"?\s*[:=]\s*([^,}\s]+)/);
  return m ? m[1].trim() : '';
}

function val(v) {
  return (v !== null && v !== undefined && String(v).trim() !== '') ? String(v).trim() : DASH;
}

function generate() {
  const raw     = document.getElementById('paste').value;
  const ticket  = document.getElementById('ticket').value.trim();
  const notice  = document.getElementById('notice');
  const results = document.getElementById('results');
  notice.className = 'hidden'; notice.innerHTML = '';
  results.innerHTML = '';

  if (!raw.trim()) { showNotice(notice,'err','Вставь данные из таблицы'); return; }
  const row = parseTSV(raw);
  if (!row) { showNotice(notice,'err','Не удалось распарсить — нужно минимум две строки: заголовки и данные'); return; }

  const orderNum = g(row,'Номер заказа');       // transaction id
  const userId   = g(row,'Id пользователя');    // user id
  const extra    = g(row,'Доп. параметры');     // источник PS id
  const psId     = extractExtRefid(extra || '');

  const missing = [];
  if (orderNum === null) missing.push('Номер заказа');
  if (extra    === null) missing.push('Доп. параметры');
  if (userId   === null) missing.push('Id пользователя');

  const warns = [];
  if (missing.length) warns.push('Не найдены колонки: ' + missing.join(', '));
  if (extra !== null && !psId) warns.push('В «Доп. параметры» не найден ext_refid');
  if (!ticket) warns.push('Не указан ticket id');
  if (warns.length) showNotice(notice,'warn', warns.join('. '));

  const parts = [val(orderNum), val(psId), val(userId), val(ticket)];

  renderResult(parts.join(' // '), [
    {k:'transaction id (Номер заказа)', v:parts[0]},
    {k:'PS id (ext_refid)',             v:parts[1]},
    {k:'user id (Id пользователя)',     v:parts[2]},
    {k:'ticket id',                     v:parts[3]},
  ]);
}

function renderResult(line, rows) {
  const c = document.getElementById('results');
  c.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'result-block';

  const hdr = document.createElement('div');
  hdr.className = 'result-header';

  const title = document.createElement('div');
  title.className = 'result-title';
  const pill = document.createElement('span');
  pill.className = 'result-title-pill';
  pill.textContent = 'Сообщение';
  title.appendChild(pill);

  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  setIdle(copyBtn);
  copyBtn.onclick = () => copyText(line, copyBtn);

  hdr.appendChild(title);
  hdr.appendChild(copyBtn);

  const lineDiv = document.createElement('div');
  lineDiv.className = 'result-line';
  lineDiv.textContent = line;

  const rowsDiv = document.createElement('div');
  rowsDiv.className = 'result-rows';
  rows.forEach(r => {
    const rd = document.createElement('div');
    rd.className = 'result-row';
    const kd = document.createElement('div'); kd.className = 'rk'; kd.textContent = r.k;
    const vd = document.createElement('div');
    vd.className = r.v === DASH ? 'rv is-missing' : 'rv';
    vd.textContent = r.v;
    rd.appendChild(kd);
    rd.appendChild(vd);
    rowsDiv.appendChild(rd);
  });

  wrap.appendChild(hdr);
  wrap.appendChild(lineDiv);
  wrap.appendChild(rowsDiv);
  c.appendChild(wrap);
}

function copyText(text, btn) {
  const onSuccess = () => {
    btn.innerHTML = svgCheck()+' Скопировано';
    btn.classList.add('ok');
    setTimeout(()=>{ setIdle(btn); btn.classList.remove('ok'); }, 2000);
  };
  // Modern API
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(onSuccess).catch(() => execCopy(text, btn, onSuccess));
  } else {
    execCopy(text, btn, onSuccess);
  }
}
function execCopy(text, btn, onSuccess) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) onSuccess();
  } catch(e) {}
}
function setIdle(btn) { btn.innerHTML = svgCopy()+' Копировать'; }
function svgCopy() { return '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="5" width="8" height="8" rx="1.5"/><path d="M3 11V3h8"/></svg>'; }
function svgCheck(){ return '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 8l4 4 8-8"/></svg>'; }

function showNotice(el, type, msg) {
  const icon = type==='err'
    ? '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11v.5"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 2l6 11H2z"/><path d="M8 7v3M8 12v.5"/></svg>';
  el.className = 'notice notice-'+type;
  el.innerHTML = icon + '<span>'+msg+'</span>';
}

function clearAll() {
  document.getElementById('paste').value='';
  document.getElementById('ticket').value='';
  document.getElementById('results').innerHTML='';
  document.getElementById('notice').className='hidden';
}

// Enter в поле ticket id — сразу генерируем
document.getElementById('ticket').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); generate(); }
});
</script>
</body>
</html>
